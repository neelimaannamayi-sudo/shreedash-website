<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin sign in · Shreedash</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3ff,#120a2a);--card:light-dark(#fff,#171d24);--ink:light-dark(#101418,#eef1f4);--mute:light-dark(#4a5562,#a7b1bc);--line:light-dark(#dde2e7,#2a323b)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;padding:16px}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:20px}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b21d6,#7c4dff);display:grid;place-items:center;font-style:normal;color:#fff}
h1{font-size:26px;margin:0 0 20px;letter-spacing:-.02em}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;font:16px "Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:10px;background:#5b21d6;color:#fff;font:700 16px "Plus Jakarta Sans",sans-serif;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid #ffc93c;outline-offset:2px}
.err{display:none;background:#fde8e6;color:#8a1c12;border-radius:8px;padding:10px 12px;font-size:14px}
a{color:var(--mute);font-size:14px;display:inline-block;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="logo"><i>S</i>Shreedash</div>
  <h1>Admin sign in</h1>
  <p class="err" id="err" role="alert">Wrong username or password. Please try again.</p>
  <form method="post" action="/admin/login">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <a href="/">Back to the website</a>
</main>
<script>if (new URLSearchParams(location.search).has('error')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
