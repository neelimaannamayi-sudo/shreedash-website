<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin setup · Shreedash</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f5f7,#101418);--card:light-dark(#fff,#171d24);--ink:light-dark(#101418,#eef1f4);--mute:light-dark(#4a5562,#a7b1bc);--line:light-dark(#dde2e7,#2a323b)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;padding:16px}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:20px}
.logo i{width:30px;height:30px;border-radius:8px;background:#ffd84a;display:grid;place-items:center;font-style:normal;color:#101418}
h1{font-size:26px;margin:0 0 20px;letter-spacing:-.02em}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;font:16px Manrope,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font:700 16px Manrope,sans-serif;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
.hint{color:var(--mute);font-size:15px;margin:0 0 6px}
.err{display:none;background:#fde8e6;color:#8a1c12;border-radius:8px;padding:10px 12px;font-size:14px}
a{color:var(--mute);font-size:14px;display:inline-block;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="logo"><i>S</i>Shreedash</div>
  <h1>Create your admin account</h1>
  <p class="hint">This appears once, before any admin exists. Enter the setup code from your server log (look for "one-time setup code"), then choose your login.</p>
  <p class="err" id="err" role="alert"></p>
  <form method="post" action="/admin/setup">
    <label for="code">Setup code</label>
    <input id="code" name="code" autocomplete="one-time-code" required autofocus>
    <label for="username">Username</label>
    <input id="username" name="username" value="admin" autocomplete="username" required>
    <label for="password">Password (at least 10 characters)</label>
    <input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
    <label for="confirm">Repeat password</label>
    <input id="confirm" name="confirm" type="password" minlength="10" autocomplete="new-password" required>
    <button type="submit">Create account and sign in</button>
  </form>
  <a href="/">Back to the website</a>
</main>
<script>{
const m = {code:'That setup code is not right. Check the latest server log.', username:'Use 3 to 100 letters, numbers, dots, dashes or @.', short:'The password needs at least 10 characters.', match:'The two passwords do not match.', server:'Something went wrong. Please try again.'};
const e = new URLSearchParams(location.search).get('error');
if (e && m[e]) { const el = document.getElementById('err'); el.textContent = m[e]; el.style.display = 'block'; }
}</script>
</body>
</html>
